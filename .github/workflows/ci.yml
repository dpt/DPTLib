---
# CI build for DPTLib
#

name: DPTLib
on: [push]
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { name: "Ubuntu build",  os: "ubuntu-latest",  install: "sudo apt-get install libpng-dev", configure: "", testbin: "builddir/DPTLibTest-debug" }
          - { name: "Windows build", os: "windows-latest", install: "vcpkg install libpng pkgconf",    configure: "--toolchain=\"${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake\"", testbin: "builddir/Debug/DPTLibTest-debug.exe" }
          - { name: "macOS build",   os: "macos-latest",   install: "",                                configure: "", testbin: "builddir/DPTLibTest-debug" }
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          ${{ matrix.config.install }}

      - name: Configure build
        run: |
          cmake -B builddir -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=YES ${{ matrix.config.configure }}

      - name: Build
        run: |
          cmake --build builddir --config Debug

      - name: Run tests
        run: |
          ${{ matrix.config.testbin }} -resources .
