---
# CI build for DPTLib
#

name: DPTLib
on: [push]
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { name: "Ubuntu build",  os: "ubuntu-latest",  install: "sudo apt-get install libpng-dev", configure: "" }
          - { name: "Windows build", os: "windows-latest", install: "vcpkg install libpng pkgconf",    configure: "--toolchain=\"${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake\"" }
          - { name: "macOS build",   os: "macos-latest",   install: "",                                configure: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          ${{ matrix.config.install }}

      - name: Configure build
        run: |
          cmake -B builddir -S . ${{ matrix.config.configure }}  # -DBUILD_TESTS=YES -DBUILD_SDL_TESTS=YES

      - name: Build
        run: |
          cmake --build builddir
