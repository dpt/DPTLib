---
# CI build for DPTLib
#

name: DPTLib
on: [push]
jobs:
  build:
    name: ${{ matrix.config.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        config:
          - { name: "Ubuntu build",  os: "ubuntu-latest",  install: "",                                configure: "" }
          - { name: "Windows build", os: "windows-latest", install: "vcpkg install libpng pkgconf",    configure: "--toolchain=\"$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake\"" }
          - { name: "macOS build",   os: "macos-latest",   install: "",                                configure: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.config.install }}

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libpng-dev
          version: 1.0

      - name: Install dependencies
        run: |
          ${{ matrix.config.install }}

      - name: Configure build
        run: |
          cmake -B builddir -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=YES ${{ matrix.config.configure }}

      - name: Build
        run: |
          cmake --build builddir --config ${{ matrix.build_type }} --parallel

      - name: List DLLs beside test binary (Windows diagnostics)
        if: runner.os == 'Windows'
        run: |
          echo "-- contents of builddir/${{ matrix.build_type }} --"
          ls -la "builddir/${{ matrix.build_type }}"
          echo "-- libpng/zlib DLLs visible on PATH --"
          where.exe libpng16.dll || true
          where.exe zlib1.dll || true

      - name: Run tests
        run: |
          case "${{ matrix.build_type }}" in
            Debug) bin=DPTLibTest-debug ;;
            MinSizeRel) bin=DPTLibTest-minsizerel ;;
            *) bin=DPTLibTest ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then testbin="builddir/${{ matrix.build_type }}/$bin.exe"; else testbin="builddir/$bin"; fi
          "$testbin" -resources .

  riscos-build:
    name: RISC OS build
    runs-on: ubuntu-latest
    container: riscosdotinfo/riscos-gccsdk-4.7:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Cache OSLib
        id: cache-oslib
        uses: actions/cache@v6
        with:
          path: oslib-bin
          key: oslib-7.00

      - name: Fetch OSLib
        if: steps.cache-oslib.outputs.cache-hit != 'true'
        run: |
          apt-get update && apt-get install -y rename
          mkdir -p oslib-bin
          cd oslib-bin
          wget -O oslib.zip 'https://sourceforge.net/projects/ro-oslib/files/OSLib/7.00/OSLib-elf-scl-app-hardfloat-7.00.zip/download?use_mirror=master'
          unzip oslib.zip
          rename 's!/h/(.*)$!/$1.h!' oslib/h/*

      - name: Install OSLib
        run: |
          source /home/riscos/gccsdk-params
          apt-get update && apt-get install -y rsync
          mkdir -p "$GCCSDK_INSTALL_ENV/include/oslib/" "$GCCSDK_INSTALL_ENV/lib/"
          rsync -av oslib-bin/oslib/ "$GCCSDK_INSTALL_ENV/include/oslib/"
          cp oslib-bin/libOSLib32.a "$GCCSDK_INSTALL_ENV/lib/"

      - name: Configure build
        run: |
          source /home/riscos/gccsdk-params
          cmake -B builddir -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=YES -DCMAKE_TOOLCHAIN_FILE=cmake/riscos.cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          source /home/riscos/gccsdk-params
          cmake --build builddir --config Release --parallel
